# CollabNet Production-Parity Local Orchestration
# Run: docker compose up --build -d
# Stop: docker compose down

services:
  # Redis for Socket.IO multi-node adapter & rate-limiting
  redis:
    image: redis:7-alpine
    container_name: collab-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Express + Socket.IO Backend API (includes interactive terminal WebSocket streaming)
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: collab-server
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=development
      - CLIENT_URL=http://localhost:8080,http://localhost:5173
      - SERVER_URL=http://localhost:3000
      - SESSION_SECRET=collabnet_docker_session_secret_32_chars_long
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    env_file:
      - path: ./server/.env
        required: false
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # React 19 Frontend SPA (Nginx)
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        - VITE_BACKEND_URL=http://localhost:3000
        - VITE_SERVER_URL=http://localhost:3000
        - VITE_PISTON_API_URL=https://emkc.org/api/v2/piston
    container_name: collab-client
    ports:
      - "8080:80"
    depends_on:
      - server
    restart: unless-stopped

